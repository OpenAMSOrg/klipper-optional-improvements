# A BigTreeTech mini12864 on a board's EXP1/EXP2 headers, as in Klipper's
# sample configs: a uc1701 128x64, an encoder and its click, no back button.
[board_pins]
aliases:
    EXP1_1=PE8, EXP1_2=PE7, EXP1_3=PE9, EXP1_4=PE10, EXP1_5=PE12,
    EXP2_1=PA6, EXP2_2=PA5, EXP2_3=PB1, EXP2_5=PB2, EXP2_6=PA7

[display]
lcd_type: uc1701
cs_pin: EXP1_3
a0_pin: EXP1_4
rst_pin: EXP1_5
encoder_pins: ^EXP2_5, ^EXP2_3
click_pin: ^!EXP1_2
contrast: 63
spi_software_miso_pin: EXP2_1
spi_software_mosi_pin: EXP2_6
spi_software_sclk_pin: EXP2_2
