# An owner's own menu file, of the usual kind: the OctoPrint list off, a
# lights entry that acts and leaves the menu, a heater input, and an
# override of a stock preheat entry.
[menu __main __octoprint]
type: disabled

[gcode_macro CYCLE_LIGHTS]
variable_state: "idle"
gcode:
    {% if state == "on" %}
        SET_GCODE_VARIABLE MACRO=CYCLE_LIGHTS VARIABLE=state VALUE='"off"'
    {% else %}
        SET_GCODE_VARIABLE MACRO=CYCLE_LIGHTS VARIABLE=state VALUE='"on"'
    {% endif %}

[menu __main __toggle_lights]
type: command
name: Lights: {printer['gcode_macro CYCLE_LIGHTS'].state | upper}
gcode:
    CYCLE_LIGHTS
    { menu.exit() }

[menu __main __temp __chamber]
type: input
name: Chamber: {'%3.0f' % menu.input}
input: {printer["heater_generic the_filter"].target}
input_min: 0
input_max: 100
input_step: 1
gcode:
    SET_HEATER_TEMPERATURE HEATER=the_filter TARGET={menu.input}

[menu __main __temp __preheat_abs __all]
type: command
enable: {('extruder' in printer) and ('heater_bed' in printer)}
name: Preheat all
gcode:
    M140 S110
    M104 S245
