# Keep main merged with upstream Klipper. Once a day, or when run by hand,
# merge Klipper3d/klipper master into main, run the same build test as
# build-test.yaml on the result, and push the merge only if both succeed.
# A conflict or a failed test leaves main as it was and opens an issue.
#
# The built-in token can not push a merge that changes a file in
# .github/workflows. For those, store a fine-grained token for this
# repository (Contents and Workflows: read and write) as the SYNC_TOKEN
# secret; without it such a merge stops at the push and the issue says so.
name: Upstream sync
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: upstream-sync

env:
  UPSTREAM_URL: https://github.com/Klipper3d/klipper.git
  UPSTREAM_BRANCH: master
  ISSUE_TITLE: Upstream sync needs a hand

jobs:
  sync:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v5
      with:
        ref: main
        fetch-depth: 0
        token: ${{ secrets.SYNC_TOKEN || github.token }}

    - name: Merge upstream
      id: merge
      run: |
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git fetch --no-tags "$UPSTREAM_URL" "$UPSTREAM_BRANCH"
        upstream=$(git rev-parse FETCH_HEAD)
        short=$(git rev-parse --short=9 FETCH_HEAD)
        echo "upstream=$short" >> "$GITHUB_OUTPUT"
        if git merge-base --is-ancestor "$upstream" HEAD; then
          echo "main already has upstream $short"
          echo "result=current" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "Merging $(git rev-list --count HEAD.."$upstream") upstream commits"
        if git merge --no-ff --no-edit "$upstream" \
            -m "Merge upstream Klipper ($short) into the voron350 series" \
            -m "Merged by the Upstream sync workflow: no conflicts, and scripts/ci-build.sh passed on the result."; then
          echo "result=merged" >> "$GITHUB_OUTPUT"
          { echo 'workflows<<EOF'
            git diff --name-only HEAD^1 HEAD -- .github/workflows
            echo EOF; } >> "$GITHUB_OUTPUT"
        else
          { echo 'conflicts<<EOF'
            git diff --name-only --diff-filter=U
            echo EOF; } >> "$GITHUB_OUTPUT"
          git merge --abort
          echo "result=conflict" >> "$GITHUB_OUTPUT"
        fi

    - name: Setup cache
      if: steps.merge.outputs.result == 'merged'
      uses: actions/cache@v5
      with:
        path: ci_cache
        key: ${{ runner.os }}-build-${{ hashFiles('scripts/ci-install.sh') }}

    - name: Prepare tests
      if: steps.merge.outputs.result == 'merged'
      run: ./scripts/ci-install.sh

    - name: Test
      id: test
      if: steps.merge.outputs.result == 'merged'
      run: ./scripts/ci-build.sh 2>&1

    - name: Push to main
      id: push
      if: steps.merge.outputs.result == 'merged'
      run: git push origin HEAD:main

    - name: Report a problem
      if: failure() || steps.merge.outputs.result == 'conflict'
      env:
        GH_TOKEN: ${{ github.token }}
        RESULT: ${{ steps.merge.outputs.result }}
        UPSTREAM: ${{ steps.merge.outputs.upstream }}
        CONFLICTS: ${{ steps.merge.outputs.conflicts }}
        WORKFLOWS: ${{ steps.merge.outputs.workflows }}
        HAS_SYNC_TOKEN: ${{ secrets.SYNC_TOKEN != '' }}
        TEST: ${{ steps.test.outcome }}
        PUSH: ${{ steps.push.outcome }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        list() { sed 's/.*/- `&`/'; }
        if [ "$RESULT" = conflict ]; then
          kind=conflict
          body="Merging upstream Klipper $UPSTREAM into main conflicts in:

        $(list <<< "$CONFLICTS")

        main is unchanged. Merge it by hand (\`git fetch $UPSTREAM_URL $UPSTREAM_BRANCH\`, then \`git merge FETCH_HEAD\`), and say in the merge commit how each conflict was resolved, as earlier syncs do."
        elif [ "$TEST" = failure ]; then
          kind=test
          body="Upstream Klipper $UPSTREAM merges into main without conflicts, but \`scripts/ci-build.sh\` fails on the result, so main is unchanged. The log is in the run below."
        elif [ "$PUSH" = failure ]; then
          kind=push
          body="Upstream Klipper $UPSTREAM merges into main and the build test passes, but the push to main was refused, so main is unchanged."
          if [ -n "$WORKFLOWS" ] && [ "$HAS_SYNC_TOKEN" != true ]; then
            body="$body The merge changes:

        $(list <<< "$WORKFLOWS")

        and the built-in token can not push changes to workflow files. Add the SYNC_TOKEN secret described at the top of \`.github/workflows/upstream-sync.yaml\`, then run the workflow again."
          else
            body="$body If main moved while the test ran, the next run retries."
          fi
        else
          kind=error
          body="The upstream sync stopped before it could merge or test. The log is in the run below."
        fi
        marker="<!-- upstream-sync $UPSTREAM $kind -->"
        body="$body

        Run: $RUN_URL

        $marker"
        num=$(gh issue list --state open --json number,title \
              --jq ".[] | select(.title == \"$ISSUE_TITLE\") | .number" | head -1)
        if [ -z "$num" ]; then
          gh issue create --title "$ISSUE_TITLE" --body "$body"
        elif ! gh issue view "$num" --json body,comments \
                --jq '.body, .comments[].body' | grep -qF "$marker"; then
          gh issue comment "$num" --body "$body"
        fi
        # A conflict is handled without failing a step; fail the run anyway
        # so it shows up red.
        [ "$RESULT" != conflict ]

    - name: Close a resolved report
      if: success() && steps.merge.outputs.result != 'conflict'
      env:
        GH_TOKEN: ${{ github.token }}
        UPSTREAM: ${{ steps.merge.outputs.upstream }}
      run: |
        for num in $(gh issue list --state open --json number,title \
                     --jq ".[] | select(.title == \"$ISSUE_TITLE\") | .number"); do
          gh issue close "$num" --comment "main has upstream Klipper $UPSTREAM again."
        done
